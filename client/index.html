<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koora Break - Live Scores</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #38bdf8;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    select,
    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      cursor: pointer;
    }

    select {
      background: #1e293b;
      color: white;
      border: 1px solid #334155;
      min-width: 160px;
    }

    button {
      background: #0ea5e9;
      color: white;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover {
      background: #0284c7;
    }

    button.unsubscribe {
      background: #ef4444;
    }

    button.unsubscribe:hover {
      background: #dc2626;
    }

    .status {
      text-align: center;
      margin-bottom: 20px;
      font-size: 14px;
      color: #94a3b8;
    }

    .scoreboard {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto 30px;
      text-align: center;
      border: 1px solid #334155;
    }

    .score {
      font-size: 48px;
      font-weight: bold;
      margin: 12px 0;
      color: #38bdf8;
    }

    .match-status {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .match-status.live {
      color: #4ade80;
    }

    .match-status.finished {
      color: #f87171;
    }

    .events {
      max-width: 600px;
      margin: 0 auto;
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #334155;
      max-height: 480px;
      overflow-y: auto;
    }

    .event {
      padding: 12px 14px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      animation: fadeIn 0.25s ease;
    }

    .event:last-child {
      border-bottom: none;
    }

    .event-type {
      font-weight: 600;
    }

    .goal {
      color: #4ade80;
    }

    .card {
      color: #fbbf24;
    }

    .red {
      color: #f87171;
    }

    .kickoff {
      color: #38bdf8;
    }

    .fulltime {
      color: #a78bfa;
    }

    .empty {
      text-align: center;
      color: #64748b;
      padding: 30px 20px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <h1>Koora Break</h1>
  <p class="subtitle">Real-time Match Events</p>

  <div class="controls">
    <select id="matchSelect">
      <option value="match_001">Match 001</option>
      <option value="match_002">Match 002</option>
      <option value="match_003">Match 003</option>
      <option value="match_004">Match 004</option>
      <option value="match_005">Match 005</option>
      <option value="match_006">Match 006</option>
      <option value="match_007">Match 007</option>
      <option value="match_008">Match 008</option>
      <option value="match_009">Match 009</option>
      <option value="match_010">Match 010</option>
      <option value="match_011">Match 011</option>
      <option value="match_012">Match 012</option>
      <option value="match_013">Match 013</option>
      <option value="match_014">Match 014</option>
      <option value="match_015">Match 015</option>
    </select>

    <button onclick="subscribe()">Subscribe</button>
    <button class="unsubscribe" onclick="unsubscribe()">Unsubscribe</button>
  </div>

  <div class="status" id="status">Not connected</div>

  <div class="scoreboard">
    <div>Current Match: <strong id="currentMatch">—</strong></div>
    <div class="score" id="score">0 - 0</div>
    <div class="match-status" id="matchStatus">Waiting...</div>
  </div>

  <div class="events" id="events">
    <div class="empty">No events yet. Subscribe to a match.</div>
  </div>

  <script>
      const socket = io('http://localhost:3000');
    let currentMatchId = null;

    const statusEl = document.getElementById('status');
    const eventsEl = document.getElementById('events');
    const scoreEl = document.getElementById('score');
    const currentMatchEl = document.getElementById('currentMatch');
    const matchStatusEl = document.getElementById('matchStatus');

      // ========== Connection ==========
    socket.on('connect', () => {
      statusEl.textContent = 'Connected to Koora Break Backend';
      statusEl.style.color = '#4ade80';
    });

    socket.on('disconnect', () => {
      statusEl.textContent = 'Disconnected';
      statusEl.style.color = '#f87171';
    });

      // ========== Live Events ==========
    socket.on('matchEvent', (event) => {
      if (!event || !event.type) return; // حماية من الأحداث التالفة

      addEvent(event);
      updateFromEvent(event);
    });

      // ========== Subscribe ==========
    function subscribe() {
      const matchId = document.getElementById('matchSelect').value;
      currentMatchId = matchId;
      currentMatchEl.textContent = matchId;

      socket.emit('subscribe', { matchId }, (response) => {
        console.log('Subscribe response:', response);

        // امسح الأحداث القديمة
        eventsEl.innerHTML = '';

        if (response && response.currentState) {
        // Late Joiner → اعرض الحالة الحالية كاملة
          const state = response.currentState;

          scoreEl.textContent = `${state.homeScore} - ${state.awayScore}`;
          setMatchStatus(state.status);

          if (state.events && state.events.length > 0) {
            // اعرض الأحداث من الأقدم للأحدث
            state.events.forEach(event => addEvent(event, false));
          } else {
            eventsEl.innerHTML = '<div class="empty">No events yet for this match.</div>';
          }
        } else {
          scoreEl.textContent = '0 - 0';
          setMatchStatus('LIVE');
          eventsEl.innerHTML = '<div class="empty">Waiting for events...</div>';
        }
      });
    }

      // ========== Unsubscribe ==========
    function unsubscribe() {
      if (!currentMatchId) return;

      socket.emit('unsubscribe', { matchId: currentMatchId });
      currentMatchId = null;
      currentMatchEl.textContent = '—';
      scoreEl.textContent = '0 - 0';
      setMatchStatus(null);
      eventsEl.innerHTML = '<div class="empty">Unsubscribed</div>';
    }

      // ========== Helpers ==========
      function addEvent(event, prepend = true) {
        // شيل رسالة الـ empty لو موجودة
        const emptyMsg = eventsEl.querySelector('.empty');
        if (emptyMsg) emptyMsg.remove();

      const div = document.createElement('div');
      div.className = 'event';

      let typeClass = '';
      if (event.type === 'GOAL') typeClass = 'goal';
      else if (event.type === 'YELLOW_CARD') typeClass = 'card';
      else if (event.type === 'RED_CARD') typeClass = 'red';
      else if (event.type === 'KICK_OFF') typeClass = 'kickoff';
      else if (event.type === 'FULL_TIME') typeClass = 'fulltime';

      const playerText = event.player ? ` — ${event.player}` : '';
      const teamText = event.team ? ` (${event.team})` : '';

      div.innerHTML = `
        <div>
          <span class="event-type ${typeClass}">${event.type}</span>
          ${playerText}${teamText}
        </div>
        <div>${event.minute ?? '-'}'</div>
      `;

      if (prepend) {
        eventsEl.prepend(div);
      } else {
        eventsEl.appendChild(div);
      }
    }

      function updateFromEvent(event) {
        // تحديث الحالة
        if (event.type === 'KICK_OFF') {
          setMatchStatus('LIVE');
        }
        if (event.type === 'FULL_TIME') {
          setMatchStatus('FINISHED');
        }

        // تحديث النتيجة بطريقة آمنة
        if (event.type === 'GOAL' && event.team) {
          const parts = scoreEl.textContent.split(' - ');
          let home = parseInt(parts[0]) || 0;
          let away = parseInt(parts[1]) || 0;

        if (event.team === 'home') home++;
        if (event.team === 'away') away++;

        scoreEl.textContent = `${home} - ${away}`;
          }
        }

        function setMatchStatus(status) {
          if (!status) {
            matchStatusEl.textContent = 'Waiting...';
            matchStatusEl.className = 'match-status';
            return;
          }

          matchStatusEl.textContent = status;
          matchStatusEl.className = 'match-status ' + status.toLowerCase();
    }
  </script>
</body>

</html>
